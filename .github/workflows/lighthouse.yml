# TEST-08: Lighthouse CI with performance budgets.
#
# Spins up the app locally (same test config as the e2e job), then runs
# Lighthouse CI against the key public pages with assert budgets:
#   performance >= 85, accessibility >= 95, best-practices >= 95, seo >= 90
# (roadmap TEST-08; budgets are passed as CLI assertions so no extra
# config file is needed).
#
# Honest status: no measured baseline exists yet on this repo — the first
# green run of this workflow ESTABLISHES the baseline. If a budget fails
# on the first run, tune the budget to the measured value (documented in
# docs/testing/a11y.md) rather than weakening the app silently.
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OPP_NO_AUTO_REFRESH: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements.in
      - name: Start app
        run: |
          nohup python -m gunicorn --bind 127.0.0.1:5000 \
            --workers 2 --timeout 60 "unified_app:create_app()" \
            > /tmp/lighthouse-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/healthz
        env:
          TESTING: "1"
          SECRET_KEY: lighthouse-ci-secret
          DATABASE_URL: sqlite:////tmp/lighthouse.db
      - run: npm install -g @lhci/cli
      - name: Run Lighthouse CI
        run: lhci autorun --config .github/workflows/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload LHCI results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: ignore
