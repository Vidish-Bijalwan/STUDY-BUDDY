<!DOCTYPE html>
<!-- OPS-13: Cold-start splash page.
     Render free instances sleep after 15 min idle; the first request can take
     ~60s. This static page is served from the CDN-backed landing site (or as
     a static file) so the user never stares at a blank tab: it polls
     /healthz and redirects to the app the moment the server is warm.

     Wiring (REPORTED — pick one):
     1. Landing site: the "Open app" button links to
        https://<landing>/cold-start.html?next=https://<app-host>/  which then
        redirects into the app when /healthz on the app host is 200.
     2. Or serve this file from Flask as a static route and link it from the
        landing page's Open-app button.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waking Study Buddy…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; min-height: 100vh; margin: 0;
    align-items: center; justify-content: center; text-align: center;
    background: #0f172a; color: #e2e8f0;
  }
  .card { max-width: 26rem; padding: 2.5rem; }
  .spinner {
    width: 3rem; height: 3rem; margin: 0 auto 1.5rem;
    border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: #94a3b8; line-height: 1.6; }
  #status { font-variant-numeric: tabular-nums; }
  a.retry { color: #38bdf8; }
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Waking the server…</h1>
  <p id="status">Study Buddy sleeps when idle to stay free. Warming up —
     this usually takes under a minute.</p>
  <p><small>Waited <span id="elapsed">0</span>s</small></p>
</main>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  // ?next= overrides the app URL; ?health= overrides the health endpoint.
  // Defaults assume this page is served from the app host itself.
  var next = params.get("next") || "/";
  var healthUrl = params.get("health") || "/healthz";
  var started = Date.now();
  var elapsedEl = document.getElementById("elapsed");
  var statusEl = document.getElementById("status");
  var attempts = 0;

  var timer = setInterval(function () {
    elapsedEl.textContent = Math.floor((Date.now() - started) / 1000);
  }, 1000);

  function poll() {
    attempts++;
    fetch(healthUrl, { cache: "no-store" })
      .then(function (r) {
        if (r.ok) {
          clearInterval(timer);
          statusEl.textContent = "Server is warm — taking you in…";
          location.replace(next);
        } else {
          schedule();
        }
      })
      .catch(schedule);
  }
  function schedule() {
    if (attempts > 40) {  // ~3-4 minutes of trying
      clearInterval(timer);
      statusEl.innerHTML =
        'Still waking up — this is taking longer than usual. ' +
        '<a class="retry" href="' + next + '">Try opening the app directly</a>.';
      return;
    }
    setTimeout(poll, 4000);
  }
  poll();
})();
</script>
</body>
</html>
