<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="resume">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.replace('no-js', 'js');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment Result | AI Resume Analyzer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bento.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resume_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kinetic.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><path d='M30 52l12 12 28-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        .as-wrap { max-width: 760px; margin: 0 auto; padding: 6.5rem 1.2rem 4rem; }
        .as-head h1 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; line-height: 0.95; font-size: clamp(2.2rem, 5vw, 3.4rem); margin-bottom: 0.4rem; }
        .as-head h1 .gradient-text { color: #2447ff; }
        .as-head p { color: var(--text-muted, #94a3b8); margin-bottom: 1.4rem; }
        .as-result-card { background: var(--bg-card); border: 1px solid rgba(16,185,129,0.25); border-radius: 18px; padding: 1.6rem; margin-bottom: 1.1rem; }
        .as-result-card h3 { font-size: 1.2rem; margin-bottom: 0.2rem; }
        .as-match { font-size: 2rem; font-weight: 800; color: var(--accent-primary); }
        .as-tagline { color: var(--text-muted, #94a3b8); font-size: 0.92rem; margin-bottom: 0.8rem; }
        .as-why { font-size: 0.94rem; color: #cbd5e1; margin-bottom: 0.8rem; }
        .as-skills { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.8rem; }
        .as-chip { background: rgba(16,185,129,0.14); color: var(--accent-primary); border-radius: 999px; padding: 0.28rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
        .as-tools { font-size: 0.88rem; }
        .as-tools a { color: var(--accent-secondary); margin-right: 0.9rem; }
        .as-ai-badge { display: inline-block; font-size: 0.75rem; background: rgba(56,189,248,0.14); color: var(--accent-info); border-radius: 999px; padding: 0.2rem 0.7rem; margin-bottom: 1rem; font-weight: 600; }
        @media (max-width: 700px) { .as-wrap { padding-top: 5.5rem; } }
    </style>
</head>
<body>
    <div class="b-scroll-progress" data-scroll-progress aria-hidden="true"></div>
    <div class="b-ambient" aria-hidden="true">
        <div class="b-blob b-b1"></div>
        <div class="b-blob b-b2"></div>
        <div class="b-blob b-b3"></div>
        <div class="b-gridlines"></div>
    </div>

    {% set nav_active = 'career' %}
    {% include "_site_nav.html" %}

    <div class="as-wrap">
        <p style="margin-bottom:1rem;color:var(--text-muted,#94a3b8);">Saved {{ created_at.strftime('%d %b %Y, %I:%M %p') if created_at else '' }} &middot; only visible to you.</p>
        <div id="asSavedResult" aria-live="polite"></div>
    </div>

    <footer class="b-footer">
        <div class="b-wrap b-foot-in">
            <span>&copy; 2026 Study-Buddy</span>
            <span>
                <a href="{{ url_for('privacy') }}">Privacy</a>
                <a href="{{ url_for('terms') }}">Terms</a>
                <a href="{{ url_for('index') }}">Home</a>
            </span>
        </div>
    </footer>

    <script>
        window.__ASSESSMENT_RESULT__ = {{ {'clusters': clusters, 'ai_powered': (clusters[0].ai_powered if clusters else False)}|tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/assessment.js') }}"></script>

    <script src="{{ url_for('static', filename='js/bento.js') }}" defer></script>
</body>
</html>
